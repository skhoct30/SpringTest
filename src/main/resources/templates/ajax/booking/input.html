<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/booking/style.css">
</head>
<body>

	<div id="wrap">
	
	    <header class="logo d-flex align-items-center justify-content-center">
	        <div class="display-4">통나무 팬션</div>
	    </header>
	
	    <nav class="main-menu font-weight-bold">
	        <ul class="nav nav-fill">
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">팬션소개</a></li>
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">객실보기</a></li>
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">예약안내</a></li>
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">커뮤니티</a></li>
	        </ul>
	    </nav>
	    

	    <section class="contents d-flex justify-content-center">	
		    <div class=" col-6 mt-4">
		    	<h3 class="text-center">예약하기</h3>
		    	
		    	<label class="mt-3 ">이름</label>
		    	<input type="text" class="form-control" id="nameInput">
		    	<label class="mt-3">예약날짜</label>
		    	<input type="text" class="form-control" id="dateInput">
		    	<label class="mt-3">숙박일수</label>
		    	<input type="text" class="form-control" id="dayInput">
		    	<label class="mt-3">숙박인원</label>
		    	<input type="text" class="form-control" id="headcountInput">
		    	<label class="mt-3">전화번호</label>
		    	<input type="text" class="form-control" id="phoneNumberInput">
		    	<button type="button" class="btn btn-warning mt-3 col-12" id="bookingBtn">예약하기</button>
		    </div>
		    
		    
		    
		    
	    </section>
		
	    
	    
	    
	</div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script>
	
		$("#bookingBtn").on("click", function(){
			
			let name = $("#nameInput").val();
			let date = $("#dateInput").val();
			let day = $("#dayInput").val();
			let headcount = $("#headcountInput").val();
			let phoneNumber = $("#phoneNumberInput").val();
			
			if(name == "") {
				alert("이름을 입력하세요");
				return;
			}
			
			if(date == "") {
				alert("날짜를 입력하세요");
				return;	
			}
			
			if(day == "") {
				alert("일수를 입력하세요");
				return;
			}
			
			//숙박일수가 숫자가 아닌 경우       유효성 검사 이거 자주 사용해서 좋음.
			// 숫자가 아니면 true
			// Not a Number
			if(isNaN(day)) {
				alert("일수는 숫자만 입력 가능합니다.");
				return;
			}
			
			
			
			if(headcount == ""){
				alert("숙박인원을 입력하세요");
				return;
			}
			if(isNaN(headcount)) {
				alert("인원은 숫자만 입력 가능합니다.");
				return;
			}
			
			if(phoneNumber == "") {
				alert("전화번호를 입력하세요");
				return;
			}
			
			
			
			
			$.ajax({
				type:"get"
				, url:"/ajax/booking/create"
				, data:{"name":name, "date":date, "day":day, "headcount":headcount, "phoneNumber":phoneNumber}
				, success:function(response){
					
					if(response.result == "success") {
						location.href = "/ajax/booking/list"; // 다른 페이지로 옮겨주는 기능 ()
					} else {
						alert("예약 실패");
					}
					
					
				}
				, error:function(){
					alert("예약과정에서 에러 발생!");
				}
			});
			
			
			
			
		});
	
	
	</script>


</body>
</html>
