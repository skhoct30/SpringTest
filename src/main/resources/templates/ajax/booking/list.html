<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>통나무 팬션 예약 리스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/booking/style.css">
</head>
<body>

	<div id="wrap">
	
	    <header class="logo d-flex align-items-center justify-content-center">
	        <div class="display-4">통나무 팬션</div>
	    </header>
	
	    <nav class="main-menu font-weight-bold">
	        <ul class="nav nav-fill">
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">팬션소개</a></li>
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">객실보기</a></li>
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">예약안내</a></li>
	            <li class="nav-item"><a href="#" class="nav-link text-white mt-1">커뮤니티</a></li>
	        </ul>
	    </nav>
	    
	    <div class="text-center p-4">
	    	<h3>예약 목록 보기</h3>
	    </div>
	    
	    <table class="table text-center">
	    	<thead>
	    		<tr>
	    			<th>이름</th>
	    			<th>예약날짜</th>
	    			<th>숙박일수</th>
	    			<th>숙박인원</th>
	    			<th>전화번호</th>
	    			<th>예약상태</th>
	    			<th></th>
	    		</tr>
	    	</thead>
	    	<tbody>
	    		<tr th:each="booking:${bookingList}">
	    			<td th:text="${booking.name}">서강현</td>
	    			<td th:text="${#temporals.format(booking.date, 'yyyy년 M월 dd일')}">2021년 6월 30일</td>
	    			<td th:text="${booking.day}">2</td>
	    			<td th:text="${booking.headcount}">4</td>
	    			<td th:text="${booking.phoneNumber}">010-1234-1111</td>
	    			<td th:switch="${booking.state}">
	    				<span th:case="대기중" class="text-primary">대기중</span>
	    				<span th:case="확정" class="text-success">확정</span>
	    			</td>
	    			<td><button type="button" th:value="${booking.id}" class="btn btn-sm btn-danger delete-btn">삭제</button></td>
	    		</tr>
	    	</tbody>
	    
	    
	    </table>
	    
	
	    <footer class="mt-3">
	        <div class="text-secondary small">
	            제주특별자치도 제주시 애월읍 <br>
	            사업자등록번호 : 111-22-255222 / 농어촌민박사업자지정 / 대표 : 김동욱 <br>
	            Copyright 2025 tongnamu All right reserved
	        </div>
	    </footer>
	</div>


	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script>
		
		$(".delete-btn").on("click", function(){
			
			let id = $(this).val();
			//alert(id);
			
			$.ajax({
				type:"get"
				, url:"/ajax/booking/delete"
				, data:{"id":id}
				, success:function(response) {
					if(response.result == "success") {
						location.reload();
					} else {
						alert("삭제 실패!");
					}
				}
				, error:function(){
					alert("삭제 에러!");
				}
			});
			
		});
		
	
	
	</script>




</body>
</html>
