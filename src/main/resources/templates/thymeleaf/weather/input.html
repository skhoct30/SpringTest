<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>날씨 입력 페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/thymeleaf/style.css">
</head>
<body>

	<div id="wrap">
		<section class="contents d-flex">
			<nav class="main-menu bg-primary">
				<img width="150" alt="기상청 이미지" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdn%2F4i0Ln%2FbtsppIIYCMz%2F8TMI2cKGpTmGjRgKmzS3p1%2Fimg.png">
				<ul class="nav flex-column">
					<li class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">날씨</a></li>
					<li class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">날씨입력</a></li>
					<li class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">테마날씨</a></li>
					<li class="nav-item"><a href="#" class="nav-link text-white font-weight-bold">관측기후</a></li>
				</ul>
			</nav>
			
			<article class="main-contents p-4">
				<h3>날씨 입력</h3>
				<div>
					<div class="d-flex flex-wrap justify-content-between p-3 form-section">
						<label>날짜</label>
						<input type="text" class="form-control col-2">
					
						<label>날씨</label>
						<select class="form-control col-3">
							<option selected>맑음</option>
							<option>구름조금</option>
							<option>흐림</option>
							<option>비</option>
						</select>
						
						<label>미세먼지</label>
						<select class="form-control col-2">
							<option selected>좋음</option>
							<option>보통</option>
							<option>나쁨</option>
							<option>최악</option>
						</select>
					</div>
					<div class="form-row d-flex flex-wrap justify-content-between p-3">
                        <div class="form-group col-md-4">
                            <label>기온</label>
                            <div class="input-group">
                                <input type="text" class="form-control">
                                <div class="input-group-append">
                                    <span class="input-group-text">℃</span>
                                </div>
                            </div>
                        </div>
                        <div class="form-group col-md-4">
                            <label>강수량</label>
                            <div class="input-group">
                                <input type="text" class="form-control">
                                <div class="input-group-append">
                                    <span class="input-group-text">mm</span>
                                </div>
                            </div>
                        </div>
                        <div class="form-group col-md-4">
                            <label>풍속</label>
                            <div class="input-group">
                                <input type="number" class="form-control">
                                <div class="input-group-append">
                                    <span class="input-group-text">km/h</span>
                                </div>
                            </div>
                        </div>
					
					</div>
				</div>
			
			</article>

		</section>
		
		<footer>
			<div class="d-flex">
				<img width="200" alt="기상청 흑백 이미지" src="https://www.inthe-x.com/assets/images/clienets/c-clinets-gisangcheong.svg">
				<div class="text-secondary mt-3">
					<div>(07062) 서울시 동작구 여의대방로 16길 61</div>
					<div>Copyright@2020 KMA. All Rights RESERVED.</div>
				</div>
			</div>
		</footer>
	
	</div>

</body>
</html>
